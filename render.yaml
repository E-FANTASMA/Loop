services:
  - type: web
    name: loop-campus-exchange
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: LOOP_HOST
        value: 0.0.0.0
      - key: LOOP_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: LOOP_ADMIN_EMAIL
        sync: false
